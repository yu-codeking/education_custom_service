slots:
  course_keyword:
    type: text
    label: 课程关键词
    description: 学员想咨询的课程名称或关键词，例如「Python」「考研数学」「全栈开发」

  series_title:
    type: text
    label: 课程名称
    description: 搜索命中的在售课程系列名称（action 回填）

  course_overview:
    type: text
    label: 课程概述
    description: 课程简介、授课方式、学员评分等信息（action 回填）

  course_cohorts:
    type: text
    label: 在售班次
    description: 该课程的在售班次、价格与开课时间（action 回填）

  order_number:
    type: text
    label: 订单号
    description: 学员的订单号，ORD 开头，例如 ORD0000000672

  order_status:
    type: text
    label: 订单状态
    description: 订单当前状态（待支付/已支付/已完成/已取消等，action 回填）

  order_summary:
    type: text
    label: 订单摘要
    description: 报名课程、金额、支付时间等摘要信息（action 回填）

  cohort_name:
    type: text
    label: 班次名称
    description: 学员报名的班次名称或关键词，例如「全栈开发系统班」

  progress_summary:
    type: text
    label: 学习进度摘要
    description: 出勤、视频完成、作业提交、考试参加等多维学习数据（action 回填）

  refund_reason:
    type: text
    label: 退费原因
    description: 学员申请退款的原因描述

  refund_type:
    type: text
    label: 退费类型
    description: 个人原因/课程不满意/时间冲突/重复购买

  ticket_type:
    type: text
    label: 工单类型
    description: 售后/投诉/退费相关

  problem_description:
    type: text
    label: 问题描述
    description: 学员遇到的具体问题内容

  ticket_summary:
    type: text
    label: 工单结果
    description: 工单创建结果与编号（action 回填）

flows:
  onboarding:
    name: 欢迎引导
    description: 在聊天窗口初次打开时欢迎用户，并介绍助手可处理的教育服务。这个 flow 通常由系统主动触发。
    steps:
      - id: start
        type: start
        next: respond

      - id: respond
        type: action
        action: action_response
        args:
          text: "你好，这里是星航教育智能客服。我可以帮你咨询课程和班次、查询订单状态、了解学习进度，也可以帮你办理退费申请、提交售后工单。"
        next: end

      - id: end
        type: end
        next: [ ]

  course_consultation:
    name: 课程咨询
    description: 帮学员查询课程简介、适用人群、授课方式、在售班次与价格。
    steps:
      - id: start
        type: start
        next: ask_course_keyword

      - id: ask_course_keyword
        type: collect
        slot_name: course_keyword
        response:
          text: "想了解哪类课程呢？比如「Python 数据分析」「考研数学」，把课程名称告诉我就行～"
        next: search_course

      - id: search_course
        type: action
        action: action_search_course_info
        next: reply_course

      - id: reply_course
        type: action
        action: action_response
        args:
          text: "为你找到课程《{{ slots.series_title }}》。{{ slots.course_overview }}{{ slots.course_cohorts }}想进一步了解哪个班次，或者直接报名的话都可以告诉我～"
        next: end

      - id: end
        type: end
        next: [ ]

  order_status_query:
    name: 订单状态查询
    description: 帮学员查询订单当前状态、支付情况和报名课程。
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        response:
          text: "请提供你的订单号（ORD 开头），也可以直接发送订单卡片哦～"
        validated:
          condition: "str(slots.get('order_number', '')).upper().startswith('ORD')"
          failure_response:
            text: "订单号一般是 ORD 开头的哦，麻烦再核对一下～"
        next: lookup_order_status

      - id: lookup_order_status
        type: action
        action: action_lookup_order_status
        next: show_order_status

      - id: show_order_status
        type: action
        action: action_response
        args:
          text: "你的订单 {{ slots.order_number }} 当前状态是：{{ slots.order_status }}。{{ slots.order_summary }}"
        next: end

      - id: end
        type: end
        next: [ ]

  learning_progress_query:
    name: 学习进度查询
    description: 帮学员查询某班次的考勤、视频观看、作业提交和考试参加情况。
    steps:
      - id: start
        type: start
        next: ask_cohort_name

      - id: ask_cohort_name
        type: collect
        slot_name: cohort_name
        response:
          text: "想看哪个班次的学习情况呢？告诉我班次名称就行，比如「全栈开发系统班」～"
        next: lookup_progress

      - id: lookup_progress
        type: action
        action: action_lookup_learning_progress
        next: show_progress

      - id: show_progress
        type: action
        action: action_response
        args:
          text: "{{ slots.progress_summary }}"
        next: end

      - id: end
        type: end
        next: [ ]

  refund_request:
    name: 退费申请
    description: 收集订单号、退费原因和类型后为学员创建退款申请。
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        response:
          text: "好的，先帮你登记退费申请。请提供要退费的订单号（ORD 开头）～"
        validated:
          condition: "str(slots.get('order_number', '')).upper().startswith('ORD')"
          failure_response:
            text: "订单号一般是 ORD 开头的哦，麻烦再核对一下～"
        next: ask_refund_reason

      - id: ask_refund_reason
        type: collect
        slot_name: refund_reason
        response:
          text: "请简单说一下退费的原因～"
        next: ask_refund_type

      - id: ask_refund_type
        type: collect
        slot_name: refund_type
        response:
          text: "主要原因属于哪一类呢：个人原因、课程不满意、时间冲突，还是重复购买？"
        next: submit_refund

      - id: submit_refund
        type: action
        action: action_create_refund
        next: reply_refund

      - id: reply_refund
        type: action
        action: action_response
        args:
          text: "{{ slots.refund_summary }}"
        next: end

      - id: end
        type: end
        next: [ ]

  ticket_submission:
    name: 工单提交
    description: 收集工单类型、关联订单和问题描述后为学员创建售后服务工单。
    steps:
      - id: start
        type: start
        next: ask_ticket_type

      - id: ask_ticket_type
        type: collect
        slot_name: ticket_type
        response:
          text: "好的，我先帮你登记工单。这是售后问题、投诉，还是退费相关的呢？"
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        response:
          text: "麻烦提供一下问题关联的订单号（ORD 开头）～"
        validated:
          condition: "str(slots.get('order_number', '')).upper().startswith('ORD')"
          failure_response:
            text: "订单号一般是 ORD 开头的哦，麻烦再核对一下～"
        next: ask_problem_description

      - id: ask_problem_description
        type: collect
        slot_name: problem_description
        response:
          text: "请具体描述一下遇到的问题，我会一并反馈给处理老师～"
        next: submit_ticket

      - id: submit_ticket
        type: action
        action: action_create_ticket
        next: reply_ticket

      - id: reply_ticket
        type: action
        action: action_response
        args:
          text: "{{ slots.ticket_summary }}"
        next: end

      - id: end
        type: end
        next: [ ]

  human_handoff:
    name: 人工客服
    description: 将当前对话转交给人工客服处理。
    steps:
      - id: start
        type: start
        next: respond

      - id: respond
        type: action
        action: action_response
        args:
          text: "好的，我来帮你转接人工客服。人工服务时间是每天 9:00-21:00，排队期间你也可以先把问题告诉我～"
        next: end

      - id: end
        type: end
        next: [ ]
